name: Feature request
description: Suggest an addition
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        tinyvault is deliberately small. Features that add a new trust
        relationship or moving part are unlikely to be accepted.
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
